[package]
name = "hackablebpe"
version = "0.1.0"
edition = "2021"

[dependencies]
ahash = "0.8"
compact_str = "0.9"
dary_heap = "0.3"
pyo3 = { version = "0.23.5", features = ["abi3-py312"] }
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "hackablebpe"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hackablebpe_train"
path = "src/main.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]
