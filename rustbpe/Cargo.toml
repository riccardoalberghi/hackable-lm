[package]
name = "simple_lm_rustbpe"
version = "0.1.0"
edition = "2021"

[lib]
name = "_simple_lm_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8"
dary_heap = "0.3"
memchr = "2.7"
pyo3 = { version = "0.23.5", features = ["abi3-py312", "extension-module"] }
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
